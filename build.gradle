plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	flatDir {
		dirs "libs"
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/gemini.accesswidener")

	mods {
		"gemini" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation name: "core", version: "3.6.6"
	implementation name: "toml", version: "3.6.6"
	include name: "core", version: "3.6.6"
	include name: "toml", version: "3.6.6"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "org.jetbrains:annotations:24.0.1"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
}

sourceSets {
	test {
		java.srcDir "test/java"
	}
}

test {
	useJUnitPlatform()
	if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_24)) {
		jvmArgs("--sun-misc-unsafe-memory-access=allow", "--enable-native-access=ALL-UNNAMED")
	}
}

if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_24)) {
	tasks.withType(JavaExec).configureEach {
		jvmArgs("--sun-misc-unsafe-memory-access=allow", "--enable-native-access=ALL-UNNAMED")
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/docs/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to in here. Notice, this block does NOT have the same function as the top level.
		// The repositories here will be used for publishing your artifact, not for retrieving dependencies.
	}
}
