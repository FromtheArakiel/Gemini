plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

allprojects {
	group = rootProject.property('group')
	version = rootProject.property('version')

	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		flatDir {
			dirs rootProject.file('libs')
		}
	}
}

gradle.projectsEvaluated {
	def moduleProjects = subprojects.findAll { it.name.startsWith('Gemini') }
	tasks.register('moduleTests') {
		group = 'verification'
		description = 'Runs tests for every Gemini module.'
		dependsOn moduleProjects.collect { it.tasks.named('test') }
	}
	tasks.register('moduleBuilds') {
		group = 'build'
		description = 'Builds every Gemini module.'
		dependsOn moduleProjects.collect { it.tasks.named('build') }
	}
	tasks.register('build') {
		group = 'build'
		description = 'Builds every Gemini module and the final GeminiBase artifact.'
		dependsOn tasks.named('moduleBuilds')
	}
	tasks.register('test') {
		group = 'verification'
		description = 'Runs tests for every Gemini module.'
		dependsOn tasks.named('moduleTests')
	}
	tasks.register('check') {
		group = 'verification'
		description = 'Runs every module verification task.'
		dependsOn tasks.named('moduleTests'), tasks.named('verifyModuleLayout')
	}
	tasks.register('clean') {
		group = 'build'
		description = 'Cleans every Gemini module and the root build directory.'
		dependsOn moduleProjects.collect { it.tasks.named('clean') }
	}
}

tasks.register('verifyModuleLayout') {
	group = 'verification'
	description = 'Checks that all expected Gemini modules are present.'
	doLast {
		def expected = [
				'GeminiBase',
				'GeminiRegistrationModule',
				'GeminiEventModule',
				'GeminiNetworkModule',
				'GeminiComponentModule',
				'GeminiCapabilityModule',
				'GeminiConfigModule',
				'GeminiLocateModule',
				'GeminiGameplayModule',
				'GeminiIntegrationModule',
				'GeminiClientModule',
				'GeminiTabModule',
				'GeminiCreativeModule'
		]
		expected.each { name ->
			if (!file("${name}/build.gradle").isFile()) {
				throw new GradleException("Missing module build script: ${name}/build.gradle")
			}
		}
	}
}

def requestedModuleName = providers.gradleProperty('module').orNull
def normalizedModuleName = requestedModuleName == null
		? null
		: requestedModuleName.startsWith(':')
		? requestedModuleName.substring(1)
		: requestedModuleName
def requestedModuleProject = normalizedModuleName == null
		? null
		: findProject(":${normalizedModuleName}")

if (normalizedModuleName != null && requestedModuleProject == null) {
	throw new GradleException("Unknown Gemini module: ${normalizedModuleName}")
}

tasks.register('testModule') {
	group = 'verification'
	description = 'Runs tests for -Pmodule=<GeminiModule>. Project dependencies are built automatically.'
	if (requestedModuleProject != null) {
		dependsOn requestedModuleProject.tasks.named('test')
	}
	doFirst {
		if (normalizedModuleName == null) {
			throw new GradleException('Specify a module with -Pmodule=<GeminiModule>')
		}
	}
}

tasks.register('buildModule') {
	group = 'build'
	description = 'Builds -Pmodule=<GeminiModule>. Project dependencies are built automatically.'
	if (requestedModuleProject != null) {
		dependsOn requestedModuleProject.tasks.named('build')
	}
	doFirst {
		if (normalizedModuleName == null) {
			throw new GradleException('Specify a module with -Pmodule=<GeminiModule>')
		}
	}
}
