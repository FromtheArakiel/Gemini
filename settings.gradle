pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'gemini-multimodule'

include(
        'GeminiBase',
        'GeminiRegistrationModule',
        'GeminiEnergyModule',
        'GeminiEventModule',
        'GeminiNetworkModule',
        'GeminiComponentModule',
        'GeminiCapabilityModule',
        'GeminiConfigModule',
        'GeminiLocateModule',
        'GeminiGameplayModule',
        'GeminiIntegrationModule',
        'GeminiClientModule',
        'GeminiTabModule',
        'GeminiCreativeModule'
)
